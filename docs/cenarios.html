<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Cenários · Viabilidade & ROI — Terrible Enfant Brasil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,300..700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TERRIBLE ENFANT · CENÁRIOS — Viabilidade & ROI Brasil
   Sistema visual: registro editorial (papel + tinta + Fraunces)
   com camada de dados densa (Inter + IBM Plex Mono tabular).
   Autocontido: sem build, sem framework, sem dependências.
   ============================================================ */

/* ---------- tokens: claro (padrão) ---------- */
:root{
  --paper:#fdfcfa; --paper-2:#f8f6f1; --paper-3:#f2efe8;
  --ink:#141414; --ink-2:#3d3a35; --ink-3:#6f6a62; --muted:#8a857c;
  --line:#e4e0d8; --line-2:#d4cfc4; --line-3:#b9b4aa;
  --accent:#c8433a; --accent-bg:#fbeae8; --accent-ink:#a5322a;
  --pos:#2e7d54; --pos-bg:#e9f4ee;
  --blue:#3a5d82; --blue-bg:#edf2f7;
  --warn:#8a6d1f; --warn-bg:#fdf6e3; --warn-line:#d9c98f;
  --edit:#fdf9ec; --edit-br:#dccf9d; --edit-focus:#b58900;
  --shadow:0 1px 2px rgba(20,20,20,.04),0 8px 24px -12px rgba(20,20,20,.14);
  --shadow-lg:0 2px 6px rgba(20,20,20,.06),0 24px 60px -24px rgba(20,20,20,.28);
  --logo-filter:invert(1);
  --grid:#eae6de;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rail:236px; --topbar:52px;
  --r:7px;
}
/* ---------- tokens: escuro ---------- */
:root[data-theme="dark"]{
  --paper:#131211; --paper-2:#1a1917; --paper-3:#222020;
  --ink:#f4f1ec; --ink-2:#d9d4cb; --ink-3:#a49e94; --muted:#8b857b;
  --line:#2c2a27; --line-2:#3a3733; --line-3:#4d4943;
  --accent:#e8776c; --accent-bg:#2d1a18; --accent-ink:#f0958b;
  --pos:#5fbf8b; --pos-bg:#14251c;
  --blue:#7ea7cf; --blue-bg:#161f28;
  --warn:#d6b95f; --warn-bg:#241f11; --warn-line:#4a3f1d;
  --edit:#211d13; --edit-br:#4a3f22; --edit-focus:#d6b95f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 24px 60px -24px rgba(0,0,0,.85);
  --logo-filter:none;
  --grid:#262421;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink-2);
  font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-variant-numeric:tabular-nums;
}
::selection{background:var(--ink);color:var(--paper)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}

/* ============================================================
   TOPBAR
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:80;height:var(--topbar);
  display:flex;align-items:center;gap:14px;
  padding:0 16px;background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(10px) saturate(1.3);
  border-bottom:1px solid var(--line);
}
.topbar.stuck{box-shadow:0 4px 18px -8px rgba(0,0,0,.22)}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0;text-decoration:none}
.brand img{height:23px;width:auto;filter:var(--logo-filter);display:block;flex-shrink:0}
.brand .bd{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);border-left:1px solid var(--line-2);padding-left:9px;white-space:nowrap}
.kstrip{display:flex;align-items:center;gap:0;margin-left:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
.kstrip::-webkit-scrollbar{display:none}
.kstrip .kx{display:flex;flex-direction:column;gap:1px;padding:0 13px;border-left:1px solid var(--line);white-space:nowrap}
.kstrip .kx:first-child{border-left:0;padding-left:4px}
.kstrip .kl{font-family:var(--mono);font-size:8.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}
.kstrip .kv{font-size:13.5px;font-weight:600;letter-spacing:-.015em;color:var(--ink);font-family:var(--mono)}
.kstrip .kv.pos{color:var(--pos)} .kstrip .kv.neg{color:var(--accent)}
.tbr{margin-left:auto;display:flex;align-items:center;gap:7px;flex-shrink:0;min-width:0}

/* pill / segmented / icon buttons */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--paper-2)}
.seg button{border:0;background:transparent;font:inherit;font-family:var(--mono);font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;cursor:pointer;color:var(--ink-3);
  border-left:1px solid var(--line);transition:background .12s,color .12s}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--paper-3);color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}
.ib{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line-2);border-radius:var(--r);background:var(--paper-2);cursor:pointer;
  color:var(--ink-3);padding:0;font-size:14px;line-height:1;transition:background .12s,color .12s,border-color .12s}
.ib:hover{background:var(--paper-3);color:var(--ink);border-color:var(--line-3)}
.ib svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  background:var(--paper-2);color:var(--ink-2);border:1px solid var(--line-2);border-radius:var(--r);
  padding:7px 12px;cursor:pointer;transition:background .12s,color .12s,border-color .12s;white-space:nowrap}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.pri:hover{opacity:.86}
.btn.dgr{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.sm{padding:4px 8px;font-size:9.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chipbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:var(--r);
  background:var(--paper-2);padding:5px 10px;cursor:pointer;font:inherit;color:var(--ink);max-width:270px}
.chipbtn:hover{border-color:var(--line-3)}
.chipbtn .cn{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipbtn .ck{font-family:var(--mono);font-size:8.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--warn);flex-shrink:0}

/* ============================================================
   LAYOUT
   ============================================================ */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);align-items:start}
.rail{position:sticky;top:var(--topbar);height:calc(100vh - var(--topbar));overflow-y:auto;
  border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--paper)}
.rail h6{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);margin:0 0 8px;padding-left:9px}
.rail nav{display:flex;flex-direction:column;gap:1px;margin-bottom:20px}
.rail a{display:flex;align-items:baseline;gap:8px;padding:6px 9px;border-radius:5px;
  text-decoration:none;color:var(--ink-3);font-size:12.5px;line-height:1.3;transition:background .12s,color .12s}
.rail a:hover{background:var(--paper-2);color:var(--ink)}
.rail a.on{background:var(--paper-3);color:var(--ink);font-weight:500}
.rail a .rn{font-family:var(--mono);font-size:9.5px;color:var(--muted);width:14px;flex-shrink:0;text-align:right}
.rail a .rv{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.rail a.warnrow .rv{color:var(--accent)}
.main{min-width:0;padding:26px 26px 120px;max-width:1400px}

@media (max-width:1080px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;top:var(--topbar);width:264px;z-index:70;
    transform:translateX(-104%);transition:transform .2s ease;box-shadow:var(--shadow-lg);border-right:1px solid var(--line-2)}
  .rail.open{transform:none}
  .main{padding:20px 16px 100px}
  .railtog{display:inline-flex !important}
  .scrim{position:fixed;inset:var(--topbar) 0 0;background:rgba(0,0,0,.34);z-index:65}
}
.railtog{display:none}

/* ============================================================
   HEADER EDITORIAL
   ============================================================ */
.hero{border-bottom:2px solid var(--ink);padding-bottom:20px;margin-bottom:22px}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(27px,3.6vw,40px);line-height:1.06;
  letter-spacing:-.015em;color:var(--ink);margin:0 0 10px;font-optical-sizing:auto}
.sub{color:var(--ink-3);font-size:12.5px;line-height:1.55;max-width:76ch}
.sub b{color:var(--ink-2);font-weight:600}
.metastrip{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--line-2);border-radius:20px;padding:3px 10px;color:var(--ink-3);background:var(--paper-2)}
.tag.on{border-color:var(--ink);color:var(--ink)}
.tag a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line-3)}

/* ============================================================
   SECTIONS
   ============================================================ */
section{margin:0 0 8px;scroll-margin-top:calc(var(--topbar) + 14px)}
.sh{display:flex;align-items:center;gap:11px;margin:30px 0 0;padding:11px 0;
  border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.sh:hover .st{color:var(--ink)}
.sh .sn{font-family:var(--mono);font-size:10px;color:var(--muted);width:20px;flex-shrink:0}
.sh .st{font-family:var(--serif);font-weight:400;font-size:21px;letter-spacing:-.012em;color:var(--ink);
  flex:1;min-width:0}
.sh .chev{width:0;height:0;border-left:4.5px solid transparent;border-right:4.5px solid transparent;
  border-top:5.5px solid var(--muted);transition:transform .16s;flex-shrink:0;margin-top:2px}
.sh:hover .chev{border-top-color:var(--ink)}
.sh.off .chev{transform:rotate(-90deg)}
.sh .sbadge{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--muted);
  background:var(--paper-2);border:1px solid var(--line);border-radius:20px;padding:2px 9px;white-space:nowrap}
.sh .sbadge.bad{color:var(--accent);border-color:var(--accent);background:var(--accent-bg)}
.sh .sbadge.good{color:var(--pos);border-color:var(--pos);background:var(--pos-bg)}
.sb{padding:16px 0 8px}
.sb.off{display:none}
.note{color:var(--ink-3);font-size:12px;line-height:1.6;margin:0 0 14px;max-width:88ch}
.note b{color:var(--ink-2);font-weight:600}
.note.tight{margin-bottom:8px}
.ttl{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}

/* card */
.card{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:16px}
.card+.card{margin-top:12px}

/* ============================================================
   TABLES
   ============================================================ */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--paper-2)}
.scroll::-webkit-scrollbar{height:9px}
.scroll::-webkit-scrollbar-thumb{background:var(--line-3);border-radius:9px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
table.plain{width:auto;border:1px solid var(--line);border-radius:9px;background:var(--paper-2)}
th{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);font-weight:500;text-align:left;padding:9px 10px;white-space:nowrap;
  border-bottom:1px solid var(--line-2);background:var(--paper-2)}
th.num,th.c{text-align:right}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.num,td.c{text-align:right;font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--ink-2)}
td.sk,.sk{color:var(--muted);font-size:11px}
td.lbl{color:var(--ink-2);min-width:150px}
td.lbl .code{display:block;font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.02em;margin-top:1px}
tr.cat td{background:var(--paper-3);font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);padding:7px 10px}
tr.grp td{background:color-mix(in srgb,var(--paper-3) 55%,transparent);font-size:11px;
  font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
tr.sb td{background:color-mix(in srgb,var(--paper-3) 60%,transparent);font-weight:500;color:var(--ink-2)}
tr.tot td{background:var(--paper-3);font-weight:600;color:var(--ink);border-top:1px solid var(--line-2)}
tr.hl td{background:var(--blue-bg)}
tr.dim{opacity:.42}
tr.zebra:nth-child(even) td{background:color-mix(in srgb,var(--paper-3) 34%,transparent)}
.pos{color:var(--pos)} .neg{color:var(--accent)}
td.zero0,.zero0{color:var(--muted);opacity:.5}
.stickycol{position:sticky;left:0;background:var(--paper-2);z-index:1}
tr.cat .stickycol{background:var(--paper-3)}
tr.tot .stickycol{background:var(--paper-3)}

/* inputs */
input.e,input.f{font:inherit;font-family:var(--mono);font-size:12px;text-align:right;
  background:var(--edit);border:1px solid var(--edit-br);border-radius:5px;color:var(--ink);
  padding:4px 7px;width:100%;min-width:56px;transition:border-color .12s,box-shadow .12s}
input.e:hover{border-color:var(--edit-focus)}
input.e:focus{outline:0;border-color:var(--edit-focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--edit-focus) 22%,transparent)}
input.e.w{max-width:82px}
input.e.z{color:var(--muted);background:color-mix(in srgb,var(--edit) 45%,transparent);border-color:var(--line-2)}
input.e.cell{max-width:66px;min-width:52px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input.txt{font:inherit;font-size:12.5px;background:var(--paper);border:1px solid var(--line-2);
  border-radius:var(--r);padding:6px 10px;color:var(--ink);text-align:left}
input.txt:focus{outline:0;border-color:var(--ink)}
select{font:inherit;font-size:12px;background:var(--paper);border:1px solid var(--line-2);
  border-radius:var(--r);padding:6px 9px;color:var(--ink);max-width:280px}
textarea{font-family:var(--mono);font-size:11.5px;background:var(--paper);border:1px solid var(--line-2);
  border-radius:var(--r);padding:10px;color:var(--ink);width:100%;resize:vertical;line-height:1.5}
label.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);cursor:pointer;
  border:1px solid var(--line-2);border-radius:20px;padding:3px 11px 3px 8px;background:var(--paper-2)}
label.chk input{accent-color:var(--ink)}
label.chk.on{border-color:var(--ink);color:var(--ink)}

/* read mode: inputs render as text */
body.read input.e{background:transparent;border-color:transparent;pointer-events:none;
  box-shadow:none;color:var(--ink-2);padding-right:0}
body.read .editonly{display:none !important}

/* toolbars */
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.bar .sep{flex:1 1 8px}
.minibar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 11px;background:var(--paper-2);
  border:1px solid var(--line);border-radius:9px;margin:0 0 12px;font-size:12px;color:var(--ink-3)}
.minibar b{font-family:var(--mono);color:var(--ink);font-weight:600}
.minibar input.e{width:78px;min-width:70px}
.minibar .sep{flex:1}

/* warnings */
.warn{display:none;align-items:flex-start;gap:9px;background:var(--warn-bg);border:1px solid var(--warn-line);
  border-left:3px solid var(--warn);border-radius:var(--r);padding:9px 12px;margin:0 0 12px;
  font-size:12px;color:var(--warn);line-height:1.5}
.warn.on{display:flex}
.warn.err{background:var(--accent-bg);border-color:var(--accent);border-left-color:var(--accent);color:var(--accent-ink)}
.warn .wi{font-family:var(--mono);font-weight:600;flex-shrink:0}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-left:3px solid var(--line-3);border-radius:9px;
  background:var(--paper-2);padding:12px 14px}
.tile .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.17em;text-transform:uppercase;
  color:var(--muted);margin-bottom:5px}
.tile .v{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--ink);line-height:1.15}
.tile .v.sm{font-size:15px}
.tile .s{font-size:11px;color:var(--ink-3);margin-top:5px;line-height:1.45}
.tile.g{border-left-color:var(--pos)} .tile.r{border-left-color:var(--accent)}
.tile.b{border-left-color:var(--blue)} .tile.k2{border-left-color:var(--ink)}
.tile .v.pos{color:var(--pos)} .tile .v.neg{color:var(--accent)}

/* ============================================================
   CHARTS
   ============================================================ */
.chartbox{border:1px solid var(--line);border-radius:9px;background:var(--paper-2);padding:14px 14px 10px;margin:0 0 12px}
.chartbox .ch{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.chartbox .ct{font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}
.chartbox .cs{font-size:11px;color:var(--ink-3)}
.chartbox svg{display:block;width:100%;height:auto;max-width:100%;overflow:visible}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.lgd{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.lgd i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.lgd span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
svg text{font-family:var(--mono);fill:var(--muted)}
svg .axis{stroke:var(--grid);stroke-width:1}
svg .zero{stroke:var(--line-3);stroke-width:1;stroke-dasharray:3 3}
svg .vlab{fill:var(--ink-2);font-size:9px}
svg .qlab{fill:var(--muted);font-size:9px}

/* gauges */
.gauges{display:flex;gap:16px;flex-wrap:wrap}
.gauge{flex:1 1 130px;min-width:126px}
.gauge .gl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.gauge .gv{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--ink)}
.gauge .gt{height:5px;background:var(--paper-3);border-radius:3px;overflow:hidden;margin-top:5px}
.gauge .gf{height:100%;background:var(--ink);border-radius:3px;transition:width .25s}
.gauge .gf.over{background:var(--accent)}
.gauge .gs{font-size:10.5px;color:var(--muted);margin-top:4px}

/* mini bar inside cells */
.mb{display:inline-block;width:38px;height:4px;background:var(--paper-3);border-radius:2px;
  overflow:hidden;vertical-align:1px;margin-left:6px}
.mb i{display:block;height:100%;background:var(--ink-3)}

/* ============================================================
   DRAWER / PALETTE / MODAL
   ============================================================ */
.drawer{position:fixed;inset:0;z-index:120;display:none}
.drawer.open{display:block}
.drawer .dscrim{position:absolute;inset:0;background:rgba(0,0,0,.42);backdrop-filter:blur(2px)}
.drawer .dpanel{position:absolute;right:0;top:0;bottom:0;width:min(660px,100%);background:var(--paper);
  border-left:1px solid var(--line-2);box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.drawer .dhead{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.drawer .dhead h3{font-family:var(--serif);font-weight:400;font-size:19px;color:var(--ink);margin:0;flex:1}
.drawer .dbody{flex:1;overflow-y:auto;padding:18px}
.drawer .dfoot{display:flex;gap:8px;align-items:center;padding:13px 18px;border-top:1px solid var(--line);background:var(--paper-2)}
.fieldrow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:9px}
.fieldrow label{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}

.palette{position:fixed;inset:0;z-index:140;display:none}
.palette.open{display:block}
.palette .pscrim{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.palette .pbox{position:absolute;left:50%;top:12vh;transform:translateX(-50%);width:min(560px,92vw);
  background:var(--paper);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;
  padding:14px 16px;font:inherit;font-size:15px;color:var(--ink);outline:0}
.palette .plist{max-height:52vh;overflow-y:auto;padding:6px}
.palette .pitem{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:6px;cursor:pointer;font-size:13px}
.palette .pitem .pk{font-family:var(--mono);font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);margin-left:auto}
.palette .pitem.sel{background:var(--paper-3)}
.palette .pitem:hover{background:var(--paper-2)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:200;
  background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;padding:10px 18px;border-radius:22px;opacity:0;transition:opacity .18s,transform .18s;
  pointer-events:none;box-shadow:var(--shadow-lg)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* diff table in import drawer */
table.diff td{font-size:11.5px}
table.diff .add{color:var(--pos)} table.diff .chg{color:var(--warn)} table.diff .del{color:var(--accent)}
.kv2{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12px}
.kv2 dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);align-self:center}
.kv2 dd{margin:0;color:var(--ink-2);font-family:var(--mono);font-size:11.5px}

/* footer */
.foot{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  display:flex;gap:16px;flex-wrap:wrap}

/* ============================================================
   RESPONSIVE
   ============================================================ */
/* preferências no rail (só quando o rail é gaveta) */
.railprefs{display:none;padding:0 9px 14px}
@media (max-width:1080px){ .railprefs{display:block} }
.railprefs .seg{margin:0 6px 6px 0}

@media (max-width:900px){
  .topbar{gap:9px;padding:0 11px}
  #langseg,#cmdtog{display:none}
  .kstrip .kx:nth-child(n+4){display:none}
  .chipbtn{max-width:160px}
}
@media (max-width:560px){
  .kstrip{display:none}
  .tbr{gap:5px}
}
@media (max-width:760px){
  .brand .bd{display:none}
  h1{font-size:26px}
  .sh .st{font-size:18px}
  .tiles{grid-template-columns:1fr 1fr}
  td.lbl{min-width:112px}
  .main{padding:16px 12px 90px}
}
@media (max-width:520px){
  .kstrip .kx:nth-child(n+3){display:none}
  .tiles{grid-template-columns:1fr}
}

/* ============================================================
   PRINT
   ============================================================ */
@media print{
  :root{--paper:#fff;--paper-2:#fff;--paper-3:#f4f2ee;--ink:#000;--ink-2:#222;--line:#ccc}
  .topbar,.rail,.bar,.minibar .editonly,.railtog,.drawer,.palette,.toast,.foot .noprint{display:none !important}
  .shell{grid-template-columns:1fr}
  .main{padding:0;max-width:none}
  .sb.off{display:block !important}
  .sh{break-after:avoid}
  section{break-inside:avoid}
  input.e{background:transparent !important;border-color:transparent !important;color:#000 !important}
  .scroll{overflow:visible;border-color:#ddd}
  body{font-size:9.5pt}
  @page{margin:14mm}
}
</style>
</head>

<script>
/* ============================================================
   CENÁRIOS · núcleo — estado, catálogo, modelo puro, formatação

const D = JSON.parse(document.getElementById('DATA').textContent);
const NQ = D.q.lab.length, NP1 = D.q.phase1;
const CATS = D.cats, CH = D.ch;
const QLAB = D.q.lab, QYEAR = D.q.year;

const LEGACY_SKUS = D.meta.legacy_skus || D.catalog.map(c => c.sku);
const isMoney = id => MONEY_RX.test(id);

/* ---------- storage ---------- */
const K = {
  st:'te-cen-v1-state', scn:'te-cen-v1-scn', sec:'te-cen-v1-sec', cur:'te-cen-v1-cur',
  lang:'te-cen-v1-lang', theme:'te-cen-v1-theme', mode:'te-cen-v1-mode',
  cat:'te-cen-v1-cat', bak:'te-cen-v1-bak', base:'te-cen-v1-base'
};
const OLD = { st:'te-viab-sh', scn:'te-viab-sh-scn', cur:'te-viab-sh-cur' };
const ls = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
  json(k,f){ try{ const v=localStorage.getItem(k); return v===null?f:JSON.parse(v); }catch(e){ return f; } }
};

/* ---------- runtime globals ---------- */
let LANG = 'pt', CUR = 'brl', MODE = 'edit';
let S  = {};                       // estado: {id: string}
let CATALOG = D.catalog.slice();   // catálogo ativo (embutido ou importado)
let CATMETA = { src:'embedded', at:null, rows:D.catalog.length };
let BASE = { name:D.seed_active, vals:null };   // cenário aplicado, para o diff
let M = null;                      // último resultado do modelo

const T   = () => D.i18n[LANG];
const U_  = k => T().ui[k] || k;
const LOC = () => T().loc;
const catL = i => T() && D.catl[LANG] ? D.catl[LANG][i] : CATS[i];
const chL  = k => D.chl[LANG][k];

/* ---------- helpers numéricos ---------- */
const num = v => { const f = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(f) ? f : 0; };
const V   = id => num(S[id]);
const fxv = () => num(S.fx) || 1;
const toDisp  = brl => CUR === 'usd' ? brl / fxv() : brl;
const toCanon = d   => CUR === 'usd' ? d * fxv() : d;
const SY = () => CUR === 'usd' ? 'US$ ' : 'R$ ';
const z0 = x => (Object.is(x,-0) || x === 0) ? 0 : x;
const R  = v => SY() + z0(Math.round(toDisp(v))).toLocaleString(LOC());
const U  = v => 'US$ ' + z0(Math.round(v)).toLocaleString(LOC());
const dec = () => LOC() === 'en-US' ? '.' : ',';
const Rk = v => { const x = toDisp(v), mi = LOC()==='en-US'?'m':'mi', ml = LOC()==='en-US'?'k':'mil';
  return Math.abs(x) >= 1e6 ? SY() + (x/1e6).toFixed(2).replace('.',dec()) + ' ' + mi
       : Math.abs(x) >= 1e4 ? SY() + Math.round(x/1e3).toLocaleString(LOC()) + ' ' + ml : R(v); };
const P  = v => (v*100).toFixed(1).replace('.',dec()) + '%';
const P0 = v => Math.round(v*100) + '%';
const N  = v => z0(Math.round(v)).toLocaleString(LOC());
const D1 = v => v.toFixed(1).replace('.',dec());
const sig = v => v > 0 ? 'pos' : (v < 0 ? 'neg' : '');
const FMT = v => { const d = String(v).replace(/\D/g,''); return d ? Number(d).toLocaleString(LOC()) : ''; };
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $  = id => document.getElementById(id);
const $$ = sel => Array.from(document.querySelectorAll(sel));

/* ============================================================
   ESTADO — construção, migração do formato posicional legado
   ============================================================ */
function blankState(){
  const s = {};
  D.order.forEach(id => s[id] = D.defaults[id]);
  // ids de catálogo dependem do tamanho do catálogo ativo
  CATALOG.forEach((c,i) => { s['srp_'+i]=String(c.srp); s['cst_'+i]=String(c.cost); s['qty_'+i]=String(c.qty); });
  return s;
}
/** ids do estado para o catálogo ativo (usado no diff e no encode) */
function catIds(){ const o=[]; CATALOG.forEach((c,i)=>o.push('srp_'+i,'cst_'+i,'qty_'+i)); return o; }
/** todos os ids válidos no estado atual */
function allIds(){
  const base = D.order.filter(id => !/^(srp|cst|qty)_\d+$/.test(id));
  return base.concat(catIds());
}

/* --- cadeia de migração do formato posicional (herdada da rev 21) --- */
function migrateArr(a){
  if(!Array.isArray(a)) return a;
  if(a.length===306) a=a.slice(0,254).concat(a.slice(262,294),['0','0','0','0','0','0'],a.slice(294,306));
  if(a.length===304){
    const pre=a.slice(0,286), mo=a.slice(286,292), op=a.slice(292,304), fq=[];
    for(let i=0;i<3;i++){
      const p1=String(Math.round((parseFloat(mo[i*2])||0)*3)), p2=String(Math.round((parseFloat(mo[i*2+1])||0)*3));
      for(let q=0;q<4;q++) fq.push(p1);
      for(let q=0;q<4;q++) fq.push(p2);
    }
    a=pre.concat(fq,op);
  }
  if(a.length===322){
    const ex=(blk,rows)=>{ const o=[];
      for(let r=0;r<rows;r++){ const row=blk.slice(r*8,(r+1)*8); while(row.length<9) row.push('0'); o.push(...row); }
      return o; };
    a=a.slice(0,222).concat(ex(a.slice(222,246),3), ex(a.slice(246,286),5), ex(a.slice(286,310),3), a.slice(310,322));
  }
  if(a.length===333) a=a.slice(0,249).concat(['1','2'], a.slice(249,333));
  if(a.length===335) a=a.slice(0,4).concat(['0','0',a[4],'0',a[5],'0'], a.slice(6,335));
  if(a.length===339) a=a.slice(0,291).concat(['0','0','0','0','0','0','0','0','0'], a.slice(291,339));
  if(a.length===348){
    const so=[];
    for(let ch=0;ch<3;ch++){ const row=a.slice(226+ch*9, 226+ch*9+9); for(let ci=0;ci<6;ci++) so.push(...row); }
    a=a.slice(0,226).concat(so, a.slice(253));
  }
  if(a.length===483) a=a.slice(0,399).concat(['0','0','0','0','0','0','0','0','0'], a.slice(399));
  if(a.length===492) a=a.slice(0,4).concat(['23'], a.slice(4));
  if(a.length===505) a=a.slice(0,4).concat(['23'], a.slice(17));
  if(a.length===493) a=a.slice(0,389).concat(['0','0','0','0','0','0','0','0','0',''], a.slice(389));
  if(a.length===503) a=['14'].concat(a.slice(0,227), a.slice(389,399), a.slice(227,389), a.slice(399));
  if(a.length===504) a=a.slice(0,228).concat([a[237]], new Array(18).fill('0'), a.slice(228,237), a.slice(238));
  if(a.length===522){
    const r=parseFloat(a[5])||0;
    const par = r<=10 ? ['0', String(r)] : [String(Math.round(Math.max(0,(r-2.3)/0.78)*10)/10), '2.3'];
    a=a.slice(0,5).concat(par, a.slice(6));
  }
  if(a.length===523) a=a.slice(0,229).concat(['88'], a.slice(229));
  if(a.length===524) a=a.slice(0,5).concat(['18','5.93'], [a[5], a[6]], ['0'], a.slice(7));
  if(a.length===527) a=a.slice(0,16).concat(['0'], a.slice(16));
  if(a.length===528 && String(a[0])!=='20'){ a=a.slice(0,14).concat([a[16]], a.slice(14,16), a.slice(17)); a[0]='20'; }
  if(a.length===528){
    // catálogo congelado da rev 21 — o array posicional é keyed nesta ordem
    a=a.slice(0,17).concat(D.meta.legacy_cat, a.slice(215));
  }
  return a;
}
/** array posicional (606) -> mapa keyed */
function arrToState(a){
  a = migrateArr(a);
  if(!Array.isArray(a) || a.length !== D.order.length) return null;
  const s = {};
  D.order.forEach((id,i) => s[id] = String(a[i]));
  return s;
}
/** mapa keyed -> array posicional (para compatibilidade de link/arquivo) */
function stateToArr(s){ return D.order.map(id => String(s[id] ?? D.defaults[id] ?? '0')); }

/** aceita array, {values:[]}, {vals:{}}, ou mapa cru; devolve mapa keyed remapeado por SKU */
function coerceState(x){
  if(!x) return null;
  // um array posicional é sempre keyed na ordem rev-21, não no catálogo atual
  if(Array.isArray(x)) return remapCat(arrToState(x), LEGACY_SKUS);
  if(Array.isArray(x.values)) return remapCat(arrToState(x.values), x.skus || LEGACY_SKUS);
  const src = x.vals && typeof x.vals === 'object' ? x.vals : x;
  if(typeof src !== 'object') return null;
  const s = blankState();
  Object.keys(src).forEach(k => { if(k[0] !== '_') s[k] = String(src[k]); });
  return remapCat(s, x.skus || src.__skus || null);
}
/** re-encaixa srp/cst/qty quando o catálogo do cenário tem outra ordem de SKUs */
function remapCat(s, skus){
  if(!s) return null;
  if(!skus || !skus.length) return s;
  const cur = CATALOG.map(c=>c.sku);
  if(skus.length === cur.length && skus.every((v,i)=>v===cur[i])) return s;
  const idx = {}; skus.forEach((sk,i)=>idx[sk]=i);
  const out = Object.assign({}, s);
  CATALOG.forEach((c,j) => {
    const i = idx[c.sku];
    ['srp','cst','qty'].forEach(p => {
      out[p+'_'+j] = i === undefined
        ? String(p==='srp'?c.srp:p==='cst'?c.cost:c.qty)
        : String(s[p+'_'+i] ?? 0);
    });
  });
  return out;
}

/* ============================================================
   MODELO PURO — recebe um estado, devolve tudo calculado.
   Nenhum acesso ao DOM: serve para o cenário em edição, para a
   comparação e para a análise de sensibilidade.
   ============================================================ */
function compute(st){
  const g = id => num(st[id]);
  const fx = g('fx') || 1;
  const mg = { sh:g('m_sh')/100, mt:g('m_mt')/100, ec:g('m_ec')/100 };

  /* --- investimento já realizado --- */
  let rzC=0, rzS=0;
  D.rz.forEach(([id,grp]) => { const v=g(id); if(grp==='c') rzC+=v; else rzS+=v; });
  const rzT = rzC + rzS;

  /* --- catálogo --- */
  const A = {}; CATS.forEach(c => A[c] = {q:0,su:0,cu:0,sq:0,cq:0,inv:0,n:0});
  const per = []; let tQ=0, tInv=0, tSU=0, tCU=0;
  CATALOG.forEach((c,i) => {
    const su=g('srp_'+i), cu=g('cst_'+i), q=g('qty_'+i);
    const iv = q*cu*fx;
    per.push({ srpU:su, costU:cu, qty:q, srpB:su*fx, costB:cu*fx, gm: su>0?(su-cu)/su:null, inv:iv });
    const a = A[c.cat] || (A[c.cat] = {q:0,su:0,cu:0,sq:0,cq:0,inv:0,n:0});
    a.q+=q; a.sq+=su*q; a.cq+=cu*q; a.su+=su; a.cu+=cu; a.inv+=iv; a.n++;
    tQ+=q; tInv+=iv; tSU+=su; tCU+=cu;
  });
  CATS.forEach(c => { const a=A[c];
    a.srp = a.q>0 ? a.sq/a.q : (a.n?a.su/a.n:0);
    a.cst = a.q>0 ? a.cq/a.q : (a.n?a.cu/a.n:0);
    a.gm  = a.srp>0 ? (a.srp-a.cst)/a.srp : null;
  });
  const nSku = CATALOG.length || 1;
  const cat = { per, byCat:A, tot:{ qty:tQ, inv:tInv, srpU:tSU/nSku, costU:tCU/nSku,
                                    gm: tSU>0?(tSU-tCU)/tSU:null } };

  /* --- alocação inicial --- */
  const alloc={}, chTot={}; CH.forEach(ch=>{ alloc[ch]={}; chTot[ch]=0; });
  const catImp=[], catSum=[], catFree=[], over=[];
  let totAl=0, totImp=0;
  CATS.forEach((c,ci) => {
    let sum=0;
    CH.forEach(ch => { const v=g(`a_${ch}_${ci}`); alloc[ch][c]=v; sum+=v; chTot[ch]+=v; });
    const imp=A[c].q;
    catImp[ci]=imp; catSum[ci]=sum; catFree[ci]=imp-sum;
    if(imp-sum < 0) over.push(`${catL(ci)}: ${N(sum)} / ${N(imp)}`);
    totAl+=sum; totImp+=imp;
  });
  const totFree = totImp - totAl;

  /* --- reposição --- */
  const cAvg  = totImp>0 ? tInv/totImp : 0;
  const rpcIn = parseFloat(st.rp_c);
  const rpc   = (isFinite(rpcIn) && rpcIn>0) ? rpcIn*fx : cAvg;
  const rp=[], rpV=[]; let rpTot=0, rpVal=0;
  for(let q=0;q<NQ;q++){ rp[q]=Math.max(0,g('rp_'+q)); rpV[q]=rp[q]*rpc; rpTot+=rp[q]; rpVal+=rpV[q]; }
  const rAl={}, rcTot={}; CH.forEach(ch=>{ rAl[ch]={}; rcTot[ch]=0; });
  const rCat=[]; let rAlTot=0;
  CATS.forEach((c,ci) => { let sum=0;
    CH.forEach(ch => { const v=Math.max(0,g(`ra_${ch}_${ci}`)); rAl[ch][c]=v; sum+=v; rcTot[ch]+=v; });
    rCat[ci]=sum; rAlTot+=sum;
  });
  const raFree = rpTot - rAlTot;

  /* --- vendas por categoria × canal --- */
  const soU={}, sold={}, overSell=[], stSold={}, stAvail={}, chCatTot={}, chCatBase={};
  CH.forEach(ch => {
    soU[ch]=[]; sold[ch]=new Array(NQ).fill(0); chCatTot[ch]=[]; chCatBase[ch]=[];
    let tot=0, av=0;
    CATS.forEach((c,ci) => {
      soU[ch][ci]=[]; let uCat=0;
      const base = alloc[ch][c] + rAl[ch][c];
      av += base;
      for(let q=0;q<NQ;q++){ const u=Math.max(0,g(`so_${ch}_${ci}_${q}`));
        soU[ch][ci][q]=u; sold[ch][q]+=u; uCat+=u; }
      chCatTot[ch][ci]=uCat; chCatBase[ch][ci]=base;
      if(uCat > base+0.001) overSell.push(`${chL(ch)} · ${catL(ci)}: ${N(uCat)} / ${N(base)}`);
      tot += uCat;
    });
    stSold[ch]=tot; stAvail[ch]=av;
  });
  const unQ=[], avail=[], bal=[], negQ=[]; let carry=totImp, totSold=0;
  for(let q=0;q<NQ;q++){
    let sQ=0; CH.forEach(ch=>sQ+=sold[ch][q]);
    unQ[q]=sQ; totSold+=sQ;
    avail[q]=carry+rp[q]; bal[q]=avail[q]-sQ; carry=bal[q];
    if(bal[q]<0) negQ.push(`${QLAB[q]}: ${N(bal[q])}`);
  }
  const stMax = Math.max(0,Math.min(100,g('so_max')))/100;
  const stTotU = totImp + rpTot;
  const stT = stTotU>0 ? totSold/stTotU : 0;
  const overST = stT > stMax+0.001;

  /* --- comunicação --- */
  const com=new Array(NQ).fill(0), grpT={b:new Array(NQ).fill(0), p:new Array(NQ).fill(0)}, comRow={};
  D.comms.forEach(([k,grp]) => { let s=0;
    for(let q=0;q<NQ;q++){ const v=g(`cm_${k}_${q}`); s+=v; com[q]+=v; grpT[grp][q]+=v; }
    comRow[k]=s;
  });
  const comT = com.reduce((a,b)=>a+b,0);

  /* --- agency fee --- */
  const fee=new Array(NQ).fill(0), feeRow={};
  D.fees.forEach(k => { let s=0;
    for(let q=0;q<NQ;q++){ const v=g(`fe_${k}_${q}`); s+=v; fee[q]+=v; } feeRow[k]=s; });
  const feeT = fee.reduce((a,b)=>a+b,0);

  /* --- operacional --- */
  const op=[], opRow=[]; let o1=0,o2=0;
  for(let i=0;i<6;i++){ const a=g('op1_'+i), b=g('op2_'+i);
    o1+=a; o2+=b; opRow[i]={m1:a, m2:b, tot:(a*NP1 + b*(NQ-NP1))*3}; }
  for(let q=0;q<NQ;q++) op[q]=(q<NP1?o1:o2)*3;
  const opT = (o1*NP1 + o2*(NQ-NP1))*3;

  /* --- receita / CMV --- */
  const rev=new Array(NQ).fill(0), cmv=new Array(NQ).fill(0), un=new Array(NQ).fill(0);
  const cAgg={}; CH.forEach(ch=>cAgg[ch]={u:0,r:0,mc:0});
  const catSold={}; CATS.forEach(c=>catSold[c]=0);
  CH.forEach(ch => CATS.forEach((c,ci) => {
    const base = alloc[ch][c] + rAl[ch][c];
    if(!base) return;
    for(let q=0;q<NQ;q++){
      const u = soU[ch][ci][q]; if(!u) continue;
      const r = u*A[c].srp*fx*(1-mg[ch]), m = u*A[c].cst*fx;
      rev[q]+=r; cmv[q]+=m; un[q]+=u; catSold[c]+=u;
      cAgg[ch].u+=u; cAgg[ch].r+=r; cAgg[ch].mc+=r-m;
    }
  }));

  /* --- estoque / OTB --- */
  const lead=Math.max(0,Math.round(g('lead'))), covT=Math.max(0,g('cover'));
  const win=Math.max(1,Math.round(covT));
  const stEnd=[], cov=[], rate=[];
  for(let q=0;q<NQ;q++){
    stEnd[q]=bal[q];
    let fut=0,nf=0;
    for(let j=q+1;j<NQ && nf<win;j++){ fut+=un[j]; nf++; }
    rate[q]=nf>0?fut/nf:0;
    cov[q]=rate[q]>0 ? Math.max(0,stEnd[q])/rate[q] : (stEnd[q]>0?Infinity:0);
  }
  let lastSale=-1; for(let q=0;q<NQ;q++) if(un[q]>0) lastSale=q;
  const semDemanda = lastSale>=0 && lastSale<NQ-1;
  let alert=-1; for(let q=0;q<NQ;q++) if(rate[q]>0 && cov[q]<covT){ alert=q; break; }
  const mudo = semDemanda && alert<0;
  const unitCost = (totImp+rpTot)>0 ? (tInv+rpVal)/(totImp+rpTot) : 0;
  let otb = { alert, mudo, semDemanda, lastSale, lead, covT, unitCost, need:0, orderQ:-1, mix:'' };
  if(alert>=0){
    otb.need = Math.max(0, Math.round(rate[alert]*covT - Math.max(0,stEnd[alert])));
    otb.orderQ = alert - lead;
    if(otb.need>0 && totSold>0)
      otb.mix = CATS.map((c,ci)=>({c:catL(ci),v:catSold[c]})).filter(x=>x.v>0)
        .map(x=>`${x.c} ${N(Math.round(otb.need*x.v/totSold))}`).join(' · ');
  }

  /* --- DRE --- */
  const rVA=Math.max(0,g('tx_va'))/100,     rREV=Math.max(0,g('tx_rev'))/100;
  const rVA26=Math.max(0,g('tx_va26'))/100, rREV26=Math.max(0,g('tx_rev26'))/100;
  const rCRED=Math.max(0,g('tx_cred'))/100;
  const tax=[], net=[], mc=[], eb=[], cum=[], rtA=[];
  const invTotal = tInv + rzT + rpVal;
  let acc = -(tInv + rzT), payback = -1;
  const byYear = {};
  for(let q=0;q<NQ;q++){
    const novo = QYEAR[q] >= 2027;
    const cred = novo ? (com[q]+fee[q]+op[q])*rCRED : 0;
    tax[q] = Math.max(0, Math.max(0,rev[q]-cmv[q])*(novo?rVA:rVA26) + rev[q]*(novo?rREV:rREV26) - cred);
    rtA[q] = rev[q]>0 ? tax[q]/rev[q] : 0;
    net[q] = rev[q]-tax[q];
    mc[q]  = net[q]-cmv[q];
    eb[q]  = mc[q]-com[q]-fee[q]-op[q];
    acc   += eb[q]-rpV[q];
    cum[q] = acc;
    if(payback<0 && acc>=0) payback=q;
    byYear[QYEAR[q]] = (byYear[QYEAR[q]]||0) + rev[q];
  }
  const sum = a => a.reduce((x,y)=>x+y,0);
  const Trev=sum(rev), Ttax=sum(tax), Tcmv=sum(cmv), Tmc=sum(mc), Teb=sum(eb);
  const overLimit = Object.values(byYear).some(v => v > 78e6);
  const roi = invTotal>0 ? Teb/invTotal : 0;
  const left = Math.max(0, stTotU-totSold);
  const leftV = stTotU>0 ? (tInv+rpVal)/stTotU*left : 0;
  const mcu = totSold>0 ? Tmc/totSold : 0;
  const fixQ = (comT+feeT+sum(op))/NQ;

  /* --- avisos --- */
  const warns = [];
  if(over.length)     warns.push({k:'alloc', sec:'s3', d:over.join(' · '), err:true});
  if(overSell.length) warns.push({k:'sell',  sec:'s4', d:overSell.join(' · '), err:true});
  if(negQ.length)     warns.push({k:'stock', sec:'s4', d:negQ.join(' · '), err:true});
  if(raFree<0)        warns.push({k:'ra',    sec:'s4', d:`${N(rAlTot)} / ${N(rpTot)}`, err:true});
  if(overST)          warns.push({k:'st',    sec:'s4', d:`${P0(stT)} ${U_('sellthru')} (${U_('ceiling')} ${P0(stMax)})`});
  if(mudo)            warns.push({k:'otb',   sec:'s5', d:U_('nodem').replace('{q}', QLAB[lastSale+1])});
  if(overLimit)       warns.push({k:'lp',    sec:'s9', d:'', err:true});

  return {
    fx, mg, rz:{c:rzC, s:rzS, t:rzT}, cat,
    alloc:{ byCh:alloc, chTot, catImp, catSum, catFree, totAl, totImp, totFree, over },
    repl:{ rp, rpV, rpTot, rpVal, rpc, cAvg, rAl, rcTot, rCat, rAlTot, raFree },
    sales:{ soU, sold, chCatTot, chCatBase, overSell, stSold, stAvail, unQ, avail, bal, negQ,
            totSold, stT, stMax, stTotU, overST },
    com:{ q:com, grp:grpT, row:comRow, tot:comT },
    fee:{ q:fee, row:feeRow, tot:feeT },
    op:{ q:op, row:opRow, tot:opT, m1:o1, m2:o2 },
    money:{ rev, cmv, un, cAgg, catSold },
    otb:{ stEnd, rate, cov, ...otb },
    dre:{ tax, net, mc, eb, cum, rtA, Trev, Ttax, Tcmv, Tmc, Teb, payback, invTotal, byYear, overLimit },
    kpi:{ invTotal, Trev, Teb, roi, payback, left, leftV, mcu, fixQ,
          be: mcu>0 ? fixQ/mcu : null, cumEnd: cum[NQ-1], sellThru: stT },
    warns
  };
}

/* ============================================================
   SENSIBILIDADE — move um driver por vez, ±delta
   ============================================================ */
const DRIVERS = [
  { k:'fx',    ids:['fx'] },
  { k:'srp',   pre:['srp_'] },
  { k:'cost',  pre:['cst_'] },
  { k:'vol',   pre:['so_'], skip:['so_max'] },
  { k:'mmt',   ids:['m_mt'] },
  { k:'comm',  pre:['cm_'] },
  { k:'fee',   pre:['fe_'] },
  { k:'opex',  pre:['op1_','op2_'] },
  { k:'tax',   ids:['tx_va','tx_va26','tx_rev','tx_rev26'] },
];
const DRIVER_L = {
  pt:{fx:'Câmbio',srp:'SRP do catálogo',cost:'Custo do catálogo',vol:'Volume de venda',
      mmt:'Margem Matalab',comm:'Verba de comunicação',fee:'Agency fee',opex:'Custos operacionais',tax:'Alíquotas'},
  en:{fx:'FX rate',srp:'Catalogue SRP',cost:'Catalogue cost',vol:'Sales volume',
      mmt:'Matalab margin',comm:'Communications budget',fee:'Agency fee',opex:'Operating costs',tax:'Tax rates'},
  es:{fx:'Tipo de cambio',srp:'SRP del catálogo',cost:'Costo del catálogo',vol:'Volumen de venta',
      mmt:'Margen Matalab',comm:'Presupuesto de comunicación',fee:'Agency fee',opex:'Costos operativos',tax:'Alícuotas'}
};
function scaleState(st, drv, f){
  const o = Object.assign({}, st);
  const hit = id => (drv.ids && drv.ids.includes(id)) ||
                    (drv.pre && drv.pre.some(p => id.startsWith(p)) && !(drv.skip||[]).includes(id));
  Object.keys(o).forEach(id => { if(hit(id)){ const v=num(o[id]); if(v) o[id]=String(v*f); } });
  return o;
}
function sensitivity(st, delta){
  const b = compute(st).dre.Teb;
  return DRIVERS.map(d => {
    const up = compute(scaleState(st,d,1+delta)).dre.Teb;
    const dn = compute(scaleState(st,d,1-delta)).dre.Teb;
    return { k:d.k, lab:DRIVER_L[LANG][d.k], up:up-b, dn:dn-b, span:Math.max(Math.abs(up-b),Math.abs(dn-b)) };
  }).sort((a,b) => b.span-a.span);
}


/* ============================================================
   GRÁFICOS — SVG inline, sem bibliotecas, ciente do tema
   ============================================================ */
const CC = { ink:'var(--ink)', ink2:'var(--ink-2)', pos:'var(--pos)', neg:'var(--accent)',
             blue:'var(--blue)', muted:'var(--muted)', grid:'var(--grid)', line:'var(--line-3)' };
const SERIES = ['var(--ink)','var(--accent)','var(--blue)','var(--pos)','var(--warn)'];

function niceMax(v){
  if(!isFinite(v) || v <= 0) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v)));
  const f = v/e;
  return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e;
}
const svgOpen = (w,h) => `<svg viewBox="0 0 ${w} ${h}" role="img">`;

/* ---------- fluxo acumulado: área + linha + marcador de payback ---------- */
function chartCum(series, labels, payback){
  const W=1120, H=200, L=8, Rr=8, T=22, B=24;
  const iw=W-L-Rr, ih=H-T-B;
  let hi=0, lo=0;
  series.forEach(s => s.v.forEach(v => { hi=Math.max(hi,v); lo=Math.min(lo,v); }));
  let top = hi>0 ? niceMax(hi) : 0, bot = lo<0 ? -niceMax(-lo) : 0;
  const pad = ((top-bot)||1)*0.08;
  if(top===0) top = pad; if(bot===0) bot = -pad;
  const span=(top-bot)||1;
  const x = i => L + (labels.length>1 ? i*iw/(labels.length-1) : iw/2);
  const y = v => T + (top-v)/span*ih;
  const y0 = y(0);
  let out = svgOpen(W,H);
  // grade horizontal
  for(let k=0;k<=4;k++){ const yy=T+k*ih/4;
    out += `<line class="axis" x1="${L}" y1="${yy.toFixed(1)}" x2="${W-Rr}" y2="${yy.toFixed(1)}"/>`; }
  out += `<line class="zero" x1="${L}" y1="${y0.toFixed(1)}" x2="${W-Rr}" y2="${y0.toFixed(1)}"/>`;
  series.forEach((s,si) => {
    const col = s.col || SERIES[si%SERIES.length];
    const pts = s.v.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    if(si===0 && series.length===1){
      const fill = s.v[s.v.length-1] < 0 ? CC.neg : CC.pos;
      out += `<polygon points="${L},${y0.toFixed(1)} ${pts} ${(W-Rr).toFixed(1)},${y0.toFixed(1)}" `
           + `fill="${fill}" opacity=".13"/>`;
    }
    out += `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="${si===0?2.2:1.5}" `
         + `stroke-linejoin="round" ${si?'stroke-dasharray="5 3"':''}/>`;
    if(si===0) s.v.forEach((v,i) =>
      out += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="var(--paper-2)" `
           + `stroke="${col}" stroke-width="1.8"/>`);
  });
  if(payback>=0 && payback<labels.length){
    const px=x(payback);
    out += `<line x1="${px.toFixed(1)}" y1="${T-8}" x2="${px.toFixed(1)}" y2="${H-B}" `
         + `stroke="${CC.pos}" stroke-width="1" stroke-dasharray="2 3"/>`
         + `<text x="${px.toFixed(1)}" y="${T-12}" text-anchor="middle" font-size="9" fill="${CC.pos}">payback</text>`;
  }
  // rótulos de valor do primeiro série (só extremos e último) + eixo x
  const s0=series[0];
  s0.v.forEach((v,i) => {
    const isEdge = i===0 || i===s0.v.length-1 || v===Math.max(...s0.v) || v===Math.min(...s0.v);
    if(isEdge) out += `<text class="vlab" x="${x(i).toFixed(1)}" y="${(y(v)+(v>=0?-8:14)).toFixed(1)}" `
      + `text-anchor="middle">${esc(Rk(v))}</text>`;
  });
  labels.forEach((l,i) => out += `<text class="qlab" x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`);
  return out + '</svg>';
}

/* ---------- barras agrupadas: receita vs EBITDA por trimestre ---------- */
function chartQuarters(rev, eb, labels){
  const W=1120, H=180, L=8, Rr=8, T=18, B=22;
  const iw=W-L-Rr, ih=H-T-B;
  const hi=niceMax(Math.max(0,...rev,...eb)), lo=-niceMax(Math.max(0,...eb.map(v=>-v),...rev.map(v=>-v)));
  const span=(hi-lo)||1;
  const y = v => T + (hi-v)/span*ih;
  const y0 = y(0);
  const gw = iw/labels.length, bw = Math.min(20,(gw-10)/2);
  let out = svgOpen(W,H);
  for(let k=0;k<=3;k++){ const yy=T+k*ih/3;
    out += `<line class="axis" x1="${L}" y1="${yy.toFixed(1)}" x2="${W-Rr}" y2="${yy.toFixed(1)}"/>`; }
  out += `<line class="zero" x1="${L}" y1="${y0.toFixed(1)}" x2="${W-Rr}" y2="${y0.toFixed(1)}"/>`;
  labels.forEach((l,i) => {
    const cx = L + gw*i + gw/2;
    [[rev[i], CC.blue, -bw-1],[eb[i], eb[i]>=0?CC.pos:CC.neg, 1]].forEach(([v,col,dx]) => {
      const yy=Math.min(y0,y(v)), hh=Math.max(1.5,Math.abs(y(v)-y0));
      out += `<rect x="${(cx+dx).toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" `
           + `height="${hh.toFixed(1)}" fill="${col}" opacity=".82" rx="1.5"/>`;
    });
    out += `<text class="qlab" x="${cx.toFixed(1)}" y="${H-7}" text-anchor="middle">${esc(l)}</text>`;
    if(rev[i]) out += `<text class="vlab" x="${(cx-bw/2-1).toFixed(1)}" y="${(y(rev[i])-4).toFixed(1)}" `
      + `text-anchor="middle" font-size="8">${esc(Rk(rev[i]))}</text>`;
  });
  return out + '</svg>';
}

/* ---------- tornado de sensibilidade ---------- */
function chartTornado(rows){
  const rowH=26, W=1120, L=210, Rr=80, T=14;
  const H=T+rows.length*rowH+10;
  const iw=W-L-Rr;
  const mx=niceMax(Math.max(1,...rows.map(r=>r.span)));
  const cx=L+iw/2;
  const sc=v => v/mx*(iw/2);
  let out = svgOpen(W,H);
  out += `<line class="zero" x1="${cx}" y1="${T-6}" x2="${cx}" y2="${H-8}"/>`;
  rows.forEach((r,i) => {
    const yy=T+i*rowH;
    [[r.dn,'-15%'],[r.up,'+15%']].forEach(([v]) => {
      const w=Math.abs(sc(v)), x=v>=0?cx:cx-w;
      out += `<rect x="${x.toFixed(1)}" y="${(yy+4).toFixed(1)}" width="${Math.max(1,w).toFixed(1)}" `
           + `height="${rowH-12}" fill="${v>=0?CC.pos:CC.neg}" opacity=".75" rx="1.5"/>`;
    });
    out += `<text x="${L-12}" y="${(yy+rowH/2+1).toFixed(1)}" text-anchor="end" font-size="10" `
         + `fill="var(--ink-2)">${esc(r.lab)}</text>`;
    out += `<text x="${W-Rr+10}" y="${(yy+rowH/2+1).toFixed(1)}" font-size="9.5" fill="${CC.muted}">`
         + `±${esc(Rk(r.span))}</text>`;
  });
  return out + '</svg>';
}

/* ---------- barras horizontais por canal ---------- */
function chartChannels(rows, key, fmt){
  const rowH=30, W=560, L=150, Rr=90, T=8;
  const H=T+rows.length*rowH+6;
  const iw=W-L-Rr;
  const mx=niceMax(Math.max(1,...rows.map(r=>Math.abs(r[key]))));
  let out = svgOpen(W,H);
  rows.forEach((r,i) => {
    const yy=T+i*rowH, w=Math.abs(r[key])/mx*iw;
    out += `<rect x="${L}" y="${(yy+6).toFixed(1)}" width="${Math.max(1,w).toFixed(1)}" height="${rowH-14}" `
         + `fill="${SERIES[i%SERIES.length]}" opacity=".8" rx="1.5"/>`;
    out += `<text x="${L-12}" y="${(yy+rowH/2+1).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--ink-2)">${esc(r.lab)}</text>`;
    out += `<text x="${(L+w+8).toFixed(1)}" y="${(yy+rowH/2+1).toFixed(1)}" font-size="9.5" fill="${CC.muted}">${esc(fmt(r[key]))}</text>`;
  });
  return out + '</svg>';
}

/* ---------- linhas mensais compactas (referência do fornecedor) ---------- */
function chartSpark(v, col){
  const W=300, H=52, P=3;
  const hi=Math.max(...v,0), lo=Math.min(...v,0), span=(hi-lo)||1;
  const x=i=>P+i*(W-2*P)/(v.length-1||1), y=k=>P+(hi-k)/span*(H-2*P);
  const pts=v.map((k,i)=>`${x(i).toFixed(1)},${y(k).toFixed(1)}`).join(' ');
  let out=svgOpen(W,H);
  if(lo<0) out+=`<line class="zero" x1="${P}" y1="${y(0).toFixed(1)}" x2="${W-P}" y2="${y(0).toFixed(1)}"/>`;
  out+=`<polygon points="${P},${y(Math.max(lo,0)).toFixed(1)} ${pts} ${W-P},${y(Math.max(lo,0)).toFixed(1)}" fill="${col}" opacity=".12"/>`;
  out+=`<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/>`;
  return out+'</svg>';
}


/* ============================================================
   RENDER — monta o DOM a partir do modelo de dados e depois
   só reescreve as células calculadas em cada recálculo.
   ============================================================ */
/* s11 (referência externa) só existe se o bloco DATA trouxer reference.jet.
   Apagar essa chave do JSON remove a seção inteira, sem tocar em mais nada. */
const HAS_REF = !!(D.reference && D.reference.jet && D.reference.jet.series);
/* a guia de leitura existe em dois arquivos; o link segue o idioma ativo */
const guideHref = () => LANG === 'pt' ? './cenarios-guia-pt.html' : './cenarios-guia.html';
const SECS = ['sum','s1','s2','s3','s4','s5','s6','s7','s8','s9','s10']
  .concat(HAS_REF ? ['s11'] : []);
const SECNO = { sum:'', s1:'1', s2:'2', s3:'3', s4:'4', s5:'5', s6:'6', s7:'7', s8:'8', s9:'9', s10:'10', s11:'11' };

/* ---------- helpers de markup ---------- */
function IN(id, o){
  o = o || {};
  const cls = ['e'].concat(o.cls ? o.cls.split(' ') : []).join(' ');
  const at = [];
  if(o.num){ at.push('type="number"'); if(o.step!==undefined) at.push(`step="${o.step}"`);
             if(o.min!==undefined) at.push(`min="${o.min}"`); if(o.max!==undefined) at.push(`max="${o.max}"`); }
  else { at.push('type="text"','inputmode="decimal"','autocomplete="off"'); }
  if(o.ph) at.push(`placeholder="${esc(o.ph)}"`);
  if(o.grid) at.push('data-grid="1"');
  return `<input class="${cls}" id="${id}" data-id="${id}" ${at.join(' ')}>`;
}
const OUT  = (id, cls) => `<td class="${cls||'num'}" id="${id}"></td>`;
const CELL = id => `<td class="c">${IN(id,{cls:'cell',grid:1})}</td>`;
const qth  = (extra) => QLAB.map(l=>`<th class="c">${l}</th>`).join('') + (extra||'');
const set  = (id, txt, cls) => { const e=$(id); if(!e) return; e.textContent=txt; if(cls!==undefined) e.className=cls; };
const seth = (id, html, cls) => { const e=$(id); if(!e) return; e.innerHTML=html; if(cls!==undefined) e.className=cls; };
const show = (id, on) => { const e=$(id); if(e) e.classList.toggle('on', !!on); };

function secShell(k, body, opts){
  opts = opts || {};
  const t = T().secs[k], no = SECNO[k];
  const desc = T().sec_desc && T().sec_desc[k] ? `<span class="sbadge" id="bd_${k}">${esc(T().sec_desc[k])}</span>` : `<span class="sbadge" id="bd_${k}" hidden></span>`;
  return `<section id="sec_${k}">
    <div class="sh${opts.open===false?' off':''}" data-tog="${k}" role="button" tabindex="0" aria-controls="sb_${k}">
      <span class="chev"></span><span class="sn">${no}</span><span class="st">${esc(t)}</span>${desc}
    </div>
    <div class="sb${opts.open===false?' off':''}" id="sb_${k}">${body}</div>
  </section>`;
}

      <th class="num">${esc(U_('qty'))}</th><th class="num">${esc(U_('invest'))}</th></tr></thead>
    <tbody id="catbody"></tbody>
    <tfoot id="catfoot"></tfoot>
  </table></div>`;

function catRows(){
  const q = CATVIEW.q.trim().toLowerCase();
  let rows = CATALOG.map((c,i) => ({ c, i }));
  if(CATVIEW.cat) rows = rows.filter(r => r.c.cat === CATVIEW.cat);
  if(q) rows = rows.filter(r => (r.c.name+' '+r.c.sku).toLowerCase().includes(q));
  const key = CATVIEW.sort;
  if(key !== 'cat'){
    const val = r => key==='name' ? r.c.name.toLowerCase()
      : key==='srp' ? -V('srp_'+r.i)
      : key==='qty' ? -V('qty_'+r.i)
      : key==='inv' ? -(V('qty_'+r.i)*V('cst_'+r.i))
      : key==='gm'  ? -(V('srp_'+r.i)>0 ? (V('srp_'+r.i)-V('cst_'+r.i))/V('srp_'+r.i) : -9)
      : 0;
    rows.sort((a,b) => { const x=val(a), y=val(b); return x<y?-1:x>y?1:0; });
  }
  return rows;
}
function renderCatalog(){
  const rows = catRows();
  let h = '', lastCat = null;
  rows.forEach(({c,i}) => {
    if(CATVIEW.sort === 'cat' && c.cat !== lastCat){
      lastCat = c.cat;
      const n = rows.filter(r => r.c.cat === c.cat).length;
      const ci = CATS.indexOf(c.cat);
      h += `<tr class="cat"><td colspan="8" class="stickycol">${esc(ci>=0?catL(ci):c.cat)} · ${n} SKUs
        <button class="btn sm editonly" data-fillcat="${esc(c.cat)}" style="margin-left:10px">${esc(U_('fillcat'))}</button></td></tr>`;
    }
    h += `<tr class="zebra" data-sku="${esc(c.sku)}">
      <td class="lbl stickycol">${esc(c.name)}<span class="code">${esc(c.sku)}</span></td>
      <td class="num">${IN('srp_'+i,{cls:'w',num:1,min:0,step:1})}</td>${OUT('sb_'+i,'num sk')}
      <td class="num">${IN('cst_'+i,{cls:'w',num:1,min:0,step:1})}</td>${OUT('cb_'+i,'num sk')}
      ${OUT('gm_'+i)}<td class="num">${IN('qty_'+i,{cls:'w',num:1,min:0,step:1})}</td>${OUT('iv_'+i)}</tr>`;
  });
  $('catbody').innerHTML = h;
  let f = '';
  if(CATVIEW.sort === 'cat' && !CATVIEW.cat && !CATVIEW.q.trim()){
    CATS.forEach((c,ci) => { if(!CATALOG.some(x=>x.cat===c)) return;
      f += `<tr class="sb"><td class="stickycol">${esc(U_('subtotal'))} ${esc(catL(ci))}</td>
        ${OUT('s_su_'+ci)}${OUT('s_sb_'+ci,'num sk')}${OUT('s_cu_'+ci)}${OUT('s_cb_'+ci,'num sk')}
        ${OUT('s_gm_'+ci)}${OUT('s_qt_'+ci)}${OUT('s_iv_'+ci)}</tr>`; });
  }
  f += `<tr class="tot"><td class="stickycol">${esc(U_('total'))}</td>${OUT('c_su')}${OUT('c_sb','num sk')}
    ${OUT('c_cu')}${OUT('c_cb','num sk')}${OUT('c_gm')}${OUT('c_qt')}${OUT('c_iv')}</tr>`;
  $('catfoot').innerHTML = f;
  syncInputs($('sb_s2'));
  set('catcount', `${rows.length} / ${CATALOG.length} SKUs`);
}

/* ---------- inputs <-> estado ---------- */
function syncInputs(root){
  (root||document).querySelectorAll('input.e').forEach(el => {
    const id = el.dataset.id; if(!id) return;
    if(isMoney(id)) el.value = FMT(Math.round(toDisp(num(S[id]))));
    else el.value = S[id] === undefined ? '' : S[id];
    el.classList.toggle('z', !num(S[id]));
  });
}
function onInput(el){
  const id = el.dataset.id; if(!id) return;
  if(isMoney(id)){
    const digits = String(el.value).replace(/\D/g,'');
    S[id] = String(toCanon(parseFloat(digits) || 0));
    const right = el.value.slice(el.selectionStart||0).replace(/\D/g,'').length;
    el.value = FMT(el.value);
    let pos = el.value.length, seen = 0;
    for(let i=el.value.length-1;i>=0;i--){
      if(/\d/.test(el.value[i])){ if(seen===right){ pos=i+1; break; } seen++; }
      if(i===0) pos=0;
    }
    if(seen < right) pos = 0;
    try{ el.setSelectionRange(pos,pos); }catch(e){}
  } else {
    S[id] = el.value;
  }
  el.classList.toggle('z', !num(S[id]));
  paint();
}

/* ============================================================
   PAINT — reescreve tudo o que é calculado
   ============================================================ */
let paintTimer = null;
function paint(){ if(paintTimer) return; paintTimer = requestAnimationFrame(() => { paintTimer=null; paintNow(); }); }

function paintNow(){
  M = compute(S);
  const m = M;
  $$('.cl').forEach(e => e.textContent = CUR==='usd' ? 'US$' : 'R$');

  /* --- premissas --- */
  set('rz_ct', R(m.rz.c)); set('rz_st', R(m.rz.s)); set('rz_t', R(m.rz.t));
  set('tx_efp', m.dre.Trev>0 ? P(m.dre.Ttax/m.dre.Trev).replace('%','') : '—');
  set('tx_efv', R(m.dre.Ttax) + ' ' + U_('txper'));
  regBadge();

  /* --- catálogo --- */
  m.cat.per.forEach((p,i) => {
    set('sb_'+i, R(p.srpB)); set('cb_'+i, R(p.costB));
    const g = $('gm_'+i);
    if(g) g.innerHTML = p.gm===null ? '—'
      : `${esc(P(p.gm))}<span class="mb"><i style="width:${Math.max(0,Math.min(100,p.gm*100)).toFixed(0)}%"></i></span>`;
    set('iv_'+i, p.inv ? R(p.inv) : '—');
  });
  CATS.forEach((c,ci) => { const a = m.cat.byCat[c]; if(!a) return;
    set('s_su_'+ci, U(a.srp)); set('s_sb_'+ci, R(a.srp*m.fx));
    set('s_cu_'+ci, U(a.cst)); set('s_cb_'+ci, R(a.cst*m.fx));
    set('s_gm_'+ci, a.gm===null?'—':P(a.gm));
    set('s_qt_'+ci, N(a.q)); set('s_iv_'+ci, R(a.inv));
  });
  set('c_su', U(m.cat.tot.srpU)); set('c_sb', R(m.cat.tot.srpU*m.fx));
  set('c_cu', U(m.cat.tot.costU)); set('c_cb', R(m.cat.tot.costU*m.fx));
  set('c_gm', m.cat.tot.gm===null?'—':P(m.cat.tot.gm));
  set('c_qt', N(m.cat.tot.qty)); set('c_iv', R(m.cat.tot.inv));
  set('catsrc', CATMETA.src==='embedded' ? U_('embedded') : `${U_('from_sheet')} · ${CATMETA.at||''}`);
  const cr = $('catrevert'); if(cr) cr.hidden = CATMETA.src==='embedded';

  /* --- alocação --- */
  CATS.forEach((c,ci) => {
    set('ai_'+ci, N(m.alloc.catImp[ci])); set('at_'+ci, N(m.alloc.catSum[ci]));
    set('af_'+ci, N(m.alloc.catFree[ci]), 'num ' + (m.alloc.catFree[ci]<0?'neg':''));
  });
  CH.forEach(ch => set('ac_'+ch, N(m.alloc.chTot[ch])));
  set('ai_t', N(m.alloc.totImp)); set('at_t', N(m.alloc.totAl));
  set('af_t', N(m.alloc.totFree), 'num ' + (m.alloc.totFree<0?'neg':''));
  show('w_alloc', m.alloc.over.length); set('w_alloc_d', m.alloc.over.join(' · '));

  /* --- reposição --- */
  CATS.forEach((c,ci) => set('rat_'+ci, m.repl.rCat[ci] ? N(m.repl.rCat[ci]) : '—'));
  CH.forEach(ch => set('rac_'+ch, N(m.repl.rcTot[ch])));
  set('rat_t', N(m.repl.rAlTot));
  set('ra_rep', U_('rarep') + ' ' + N(m.repl.rpTot));
  set('ra_free', N(m.repl.raFree), 'num ' + (m.repl.raFree<0?'neg':''));
  show('w_ra', m.repl.raFree<0); set('w_ra_d', `${N(m.repl.rAlTot)} / ${N(m.repl.rpTot)}`);
  set('rp_t', m.repl.rpTot ? N(m.repl.rpTot)+' '+U_('units') : '—');
  set('rp_v', R(m.repl.rpVal));
  set('rp_ch', m.repl.cAvg>0 ? `${U_('rpauto')} · US$ ${N(Math.round(m.repl.cAvg/m.fx))}` : U_('rpauto'));

  /* --- vendas --- */
  CH.forEach(ch => {
    let tot = 0;
    CATS.forEach((c,ci) => {
      const u = m.sales.chCatTot[ch][ci], base = m.sales.chCatBase[ch][ci];
      const e = $(`so_${ch}_${ci}_t`);
      if(e){ e.innerHTML = u ? `${esc(N(u))}<span class="sk"> / ${esc(N(base))} ${esc(U_('units'))} · ${esc(P0(base>0?u/base:0))}</span>` : '—';
             e.className = 'num ' + (u > base+0.001 ? 'neg' : ''); }
      const row = $(`sor_${ch}_${ci}`); if(row) row.classList.toggle('dim', !(base>0));
      tot += u;
    });
    for(let q=0;q<NQ;q++) set(`su_${ch}_${q}`, m.sales.sold[ch][q] ? N(m.sales.sold[ch][q]) : '—', 'c');
    set(`su_${ch}_t`, N(tot));
  });
  for(let q=0;q<NQ;q++){
    set('sq_'+q, m.sales.unQ[q] ? N(m.sales.unQ[q]) : '—', 'c');
    set('mv_av_'+q, N(m.sales.avail[q]), 'c sk');
    set('mv_bal_'+q, N(m.sales.bal[q]), 'c ' + (m.sales.bal[q]<0?'neg':''));
  }
  set('sq_t', N(m.sales.totSold));
  show('w_sell', m.sales.overSell.length); set('w_sell_d', m.sales.overSell.join(' · '));
  show('w_stock', m.sales.negQ.length); set('w_stock_d', m.sales.negQ.join(' · '));
  set('st_real', m.sales.stTotU>0 ? P0(m.sales.stT) : '—', m.sales.overST?'neg':'');
  set('st_ch', ' · ' + CH.map(ch => `${chL(ch)} ${m.sales.stAvail[ch]>0?P0(m.sales.stSold[ch]/m.sales.stAvail[ch]):'—'}`).join(' · '));
  show('w_st', m.sales.overST);
  set('w_st_d', `${P0(m.sales.stT)} ${U_('sellthru')} (${U_('ceiling')} ${P0(m.sales.stMax)})`);

  /* --- comunicação / fee / opex --- */
  D.comms.forEach(([k]) => set(`cm_${k}_t`, R(m.com.row[k])));
  ['b','p'].forEach(g => { let s=0;
    for(let q=0;q<NQ;q++){ set(`cg_${g}_${q}`, R(m.com.grp[g][q]), 'c'); s+=m.com.grp[g][q]; }
    set(`cg_${g}_t`, R(s)); });
  for(let q=0;q<NQ;q++) set('cm_q_'+q, R(m.com.q[q]), 'c');
  set('cm_tt', R(m.com.tot));
  D.fees.forEach(k => set(`fe_${k}_t`, R(m.fee.row[k])));
  for(let q=0;q<NQ;q++) set('fe_q_'+q, R(m.fee.q[q]), 'c');
  set('fe_tt', R(m.fee.tot));
  m.op.row.forEach((r,i) => set('opt_'+i, R(r.tot)));
  set('op1t', R(m.op.m1)); set('op2t', R(m.op.m2)); set('optt', R(m.op.tot));

  /* --- OTB --- */
  for(let q=0;q<NQ;q++){
    set('ot_end_'+q, N(m.otb.stEnd[q]), 'c ' + (m.otb.stEnd[q]<0?'neg':''));
    set('ot_rate_'+q, m.otb.rate[q]>0 ? N(Math.round(m.otb.rate[q])) : '—', 'c sk');
    set('ot_cov_'+q, m.otb.cov[q]===Infinity ? '∞' : D1(m.otb.cov[q]),
        'c ' + (m.otb.cov[q] < m.otb.covT ? 'neg' : ''));
  }
  if(m.otb.alert >= 0){
    const a = m.otb.alert;
    set('ot_alert', QLAB[a], 'v sm neg');
    set('ot_alert_s', `${N(Math.max(0,m.otb.stEnd[a]))} un · ${D1(m.otb.cov[a])} / ${m.otb.covT} · ${N(Math.round(m.otb.rate[a]))} un/T ${U_('otbrate')}`);
    set('ot_order', m.otb.orderQ>=0 ? QLAB[m.otb.orderQ] : QLAB[0], 'v sm' + (m.otb.orderQ<0?' neg':''));
    set('ot_order_s', m.otb.orderQ<0 ? U_('otbnow') : `lead time ${m.otb.lead}T`);
    set('ot_size', N(m.otb.need) + ' un', 'v sm');
    set('ot_size_s', `${R(m.otb.need*m.otb.unitCost)} ${U_('atcost')} · ${U_('otbcalc')}: ${N(Math.round(m.otb.rate[a]))} × ${D1(m.otb.covT)} − ${N(Math.max(0,m.otb.stEnd[a]))}`);
    set('ot_mix', m.otb.mix || '—');
    const w=$('ot_mixw'); if(w) w.style.display = m.otb.mix ? '' : 'none';
  } else {
    set('ot_alert','—','v sm'); set('ot_alert_s', m.otb.semDemanda ? U_('otbinf') : U_('otbok'));
    set('ot_order','—','v sm'); set('ot_order_s','');
    set('ot_size','—','v sm'); set('ot_size_s','');
    const w=$('ot_mixw'); if(w) w.style.display='none';
  }
  show('w_otb', m.otb.mudo);
  set('w_otb_d', m.otb.mudo ? U_('nodem').replace('{q}', QLAB[m.otb.lastSale+1]) : '');

  /* --- DRE --- */
  const series = { rev:m.money.rev, tax:m.dre.tax.map(v=>-v), net:m.dre.net,
                   cmv:m.money.cmv.map(v=>-v), mc:m.dre.mc, com:m.com.q.map(v=>-v),
                   fee:m.fee.q.map(v=>-v), op:m.op.q.map(v=>-v), eb:m.dre.eb, cum:m.dre.cum };
  D.dre.forEach(k => {
    const a = series[k]; let s = 0;
    for(let q=0;q<NQ;q++){ set(`d_${k}_${q}`, R(a[q]), 'num ' + (k==='cum'?sig(a[q]):'')); s += a[q]; }
    if(k === 'cum') set('d_cum_t', R(a[NQ-1]), 'num ' + sig(a[NQ-1]));
    else set(`d_${k}_t`, R(s), 'num ' + (k==='eb'?sig(s):''));
  });
  for(let q=0;q<NQ;q++) set('d_rate_'+q, P(m.dre.rtA[q]), 'num sk');
  show('w_lp', m.dre.overLimit);

  /* --- KPIs --- */
  const k = m.kpi;

/* ---------- link compartilhável ---------- */
const B64U   = b => btoa(String.fromCharCode.apply(null, new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const UNB64U = s => { const b=atob(s.replace(/-/g,'+').replace(/_/g,'/')), u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; };
async function zip(s){
  const cs = new CompressionStream('deflate-raw'), w = cs.writable.getWriter();
  w.write(new TextEncoder().encode(s)); w.close();
  return B64U(await new Response(cs.readable).arrayBuffer());
}
async function unzip(s){
  const ds = new DecompressionStream('deflate-raw'), w = ds.writable.getWriter();
  w.write(UNB64U(s)); w.close();
  return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
}
/* RLE do formato posicional (compatível com os links da rev 21) */
function encRLE(v){
  const out=[]; let i=0;
  while(i<v.length){
    let j=i; while(j<v.length && v[j]===v[i]) j++;
    const n=j-i, val=(v[i]===''?'_':v[i]);
    if(n>2) out.push(val+'*'+n); else for(let k=0;k<n;k++) out.push(val);
    i=j;
  }
  return out.join(',');
}
function decRLE(str){
  const out=[];
  str.split(',').forEach(tok => {
    const k=tok.indexOf('*');
    if(k>0){ const val=tok.slice(0,k), n=parseInt(tok.slice(k+1))||0;
      for(let x=0;x<n;x++) out.push(val==='_'?'':val); }
    else out.push(tok==='_'?'':tok);
  });
  return out;
}
function pctToUnits(a){
  if(!a || a.length !== 606) return a;
  const out = a.slice();
  for(let ch=0;ch<3;ch++) for(let ci=0;ci<6;ci++){
    const al = parseFloat(a[293+ci*3+ch]) || 0;
    for(let q=0;q<NQ;q++){ const i=340+ch*54+ci*9+q;
      out[i] = String(Math.round(al*(parseFloat(a[i])||0)/100)); }
  }
  return out;
}
async function shareUrl(){
  const base = location.origin + location.pathname
    + '?' + new URLSearchParams({ lang:LANG, cur:CUR }).toString();
  const payload = JSON.stringify({ skus:CATALOG.map(c=>c.sku), vals:S, base:BASE.name });
  try{ if(window.CompressionStream) return base + '#c1=' + await zip(payload); }catch(e){}
  return base + '#v2=' + encRLE(stateToArr(S));
}
async function readHash(){
  const h = location.hash.slice(1);
  if(!h) return null;
  if(h.startsWith('c1=')){ try{ const o=JSON.parse(await unzip(h.slice(3)));
    return { s:coerceState(o), base:o.base }; }catch(e){ return null; } }
  if(h.startsWith('v3=')){ try{ return { s:coerceState(decRLE(await unzip(h.slice(3)))) }; }catch(e){ return null; } }
  if(h.startsWith('v2=')) return { s:coerceState(decRLE(h.slice(3))) };
  if(h.startsWith('v1=')) return { s:coerceState(pctToUnits(migrateArr(decRLE(h.slice(3))))) };
  try{ return { s:coerceState(pctToUnits(migrateArr(JSON.parse(decodeURIComponent(escape(atob(h)))))) ) }; }catch(e){ return null; }
}
function copyTxt(t){
  return (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).catch(() => {
    const a = document.createElement('textarea');
    a.value = t; a.style.position='fixed'; a.style.opacity='0';
    document.body.appendChild(a); a.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(a);
  });
}

async function fetchFx(){
  const info = $('fxinfo'); if(info) info.textContent = U_('fx_load');
  const srcs = [
    ['https://api.frankfurter.app/latest?from=USD&to=BRL', j => [j.rates && j.rates.BRL, j.date]],
    ['https://open.er-api.com/v6/latest/USD', j => [j.rates && j.rates.BRL, (j.time_last_update_utc||'').slice(5,16)]],
    ['https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json', j => [j.usd && j.usd.brl, j.date]],
  ];
  for(const [u,pick] of srcs){
    try{
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 6000);
      const r = await fetch(u, { cache:'no-store', signal:ctl.signal }); clearTimeout(t);
      if(!r.ok) continue;
      const [rate,date] = pick(await r.json());
      if(rate && isFinite(rate)){
        S.fx = Number(rate).toFixed(4);
        if(info) info.textContent = U_('fx_src') + (date ? ' · ' + date : '');
        syncInputs(); paintNow(); return true;
      }
    }catch(e){}
  }
  if(info) info.textContent = U_('fx_fail');
  return false;
}

function splitCSV(text){
  const first = (text.split(/\r?\n/).find(l => l.trim()) || '');
  const cands = [[',',(first.match(/,/g)||[]).length], [';',(first.match(/;/g)||[]).length],
                 ['\t',(first.match(/\t/g)||[]).length]];
  cands.sort((a,b)=>b[1]-a[1]);
  const dl = cands[0][1] > 0 ? cands[0][0] : ',';
  const rows = []; let row = [], cell = '', q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if(c === '"'){ q = true; }
    else if(c === dl){ row.push(cell); cell = ''; }
    else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if(c === '\r'){ /* skip */ }
    else cell += c;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
function parseNum(v){
  let s = String(v == null ? '' : v).replace(/[^\d,.\-]/g,'').trim();
  if(!s) return null;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if(lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else if(lc > -1) s = (s.length - lc - 1) === 3 && /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g,'') : s.replace(',','.');
  const f = parseFloat(s);
  return isFinite(f) ? f : null;
}
function guessMap(head){
  const map = {}; const used = new Set();
  FIELDS.forEach(f => {
    let best = -1, bestScore = 0;
    head.forEach((h,i) => {
      if(used.has(i)) return;
      const lh = String(h).toLowerCase();
      let sc = 0;
      HINTS[f].forEach(k => { if(lh.includes(k)) sc = Math.max(sc, k.length); });
      if(sc > bestScore){ bestScore = sc; best = i; }
    });
    if(best >= 0){ map[f] = best; used.add(best); }
  });
  return map;
}
const normSku = s => String(s||'').toUpperCase().replace(/\s+/g,'');
function buildDiff(){
  const { rows, map } = IMP;
  const cur = {}; CATALOG.forEach((c,i) => cur[normSku(c.sku)] = { c, i });
  const seen = new Set();
  const out = { changed:[], added:[], missing:[], same:0, bad:0, rows:[] };
  rows.forEach(r => {
    const sku = map.sku !== undefined ? String(r[map.sku]||'').trim() : '';
    if(!sku){ out.bad++; return; }
    const key = normSku(sku);
    if(seen.has(key)){ out.bad++; return; }
    seen.add(key);
    const rec = {
      sku, key,
      name: map.name !== undefined ? String(r[map.name]||'').trim() : '',
      cat:  map.cat  !== undefined ? String(r[map.cat]||'').trim()  : '',
      srp:  map.srp  !== undefined ? parseNum(r[map.srp])  : null,
      cost: map.cost !== undefined ? parseNum(r[map.cost]) : null,
      qty:  map.qty  !== undefined ? parseNum(r[map.qty])  : null,
    };
    const old = cur[key];
    if(!old){ rec.kind = 'added'; out.added.push(rec); }
    else {
      const d = [];
      if(rec.srp  !== null && Math.abs(rec.srp  - V('srp_'+old.i)) > 1e-6) d.push(['srp',  V('srp_'+old.i), rec.srp]);
      if(rec.cost !== null && Math.abs(rec.cost - V('cst_'+old.i)) > 1e-6) d.push(['cost', V('cst_'+old.i), rec.cost]);
      if(rec.qty  !== null && Math.abs(rec.qty  - V('qty_'+old.i)) > 1e-6) d.push(['qty',  V('qty_'+old.i), rec.qty]);
      rec.old = old; rec.d = d;
      if(d.length){ rec.kind = 'changed'; out.changed.push(rec); } else { rec.kind='same'; out.same++; }
    }
    out.rows.push(rec);
  });
  CATALOG.forEach((c,i) => { if(!seen.has(normSku(c.sku))) out.missing.push({ c, i }); });
  IMP.diff = out;
  return out;
}
function applyImport(){
  const dif = IMP.diff; if(!dif) return;
  bak();
  const CATOLD = CATALOG, SOLD = S;
  const oldIdx = {}; CATOLD.forEach((c,i) => oldIdx[normSku(c.sku)] = i);
  const next = [], vals = [];
  dif.rows.forEach(r => {
    const oi = oldIdx[r.key];
    const base = oi !== undefined ? CATOLD[oi] : null;
    const catName = matchCat(r.cat) || (base ? base.cat : CATS[CATS.length-1]);
    next.push({ sku:r.sku, name:r.name || (base ? base.name : r.sku), cat:catName,
                srp:r.srp !== null ? r.srp : (base ? num(SOLD['srp_'+oi]) : 0),
                cost:r.cost !== null ? r.cost : (base ? num(SOLD['cst_'+oi]) : 0),
                qty:r.qty !== null ? r.qty : (base ? num(SOLD['qty_'+oi]) : 0) });
  });
  // SKUs que a planilha não trouxe ficam no fim, preservados
  dif.missing.forEach(({c,i}) => next.push({ sku:c.sku, name:c.name, cat:c.cat,
    srp:num(SOLD['srp_'+i]), cost:num(SOLD['cst_'+i]), qty:num(SOLD['qty_'+i]) }));

  CATALOG = next;
  CATMETA = { src:'sheet', at:stamp(Date.now()), rows:next.length };
  ls.set(K.cat, JSON.stringify({ c:CATALOG, m:CATMETA }));
  // reencaixa o estado: mantém tudo o que não é catálogo, escreve os novos valores
  const keep = {};
  Object.keys(SOLD).forEach(id => { if(!/^(srp|cst|qty)_\d+$/.test(id)) keep[id] = SOLD[id]; });
  S = keep;
  CATALOG.forEach((c,i) => { S['srp_'+i]=String(c.srp); S['cst_'+i]=String(c.cost); S['qty_'+i]=String(c.qty); });
  if(BASE.vals){ const b={}; Object.keys(BASE.vals).forEach(id=>{ if(!/^(srp|cst|qty)_\d+$/.test(id)) b[id]=BASE.vals[id]; });
    CATALOG.forEach((c,i)=>{ b['srp_'+i]=String(c.srp); b['cst_'+i]=String(c.cost); b['qty_'+i]=String(c.qty); });
    BASE.vals=b; }
  seth('hmeta', metaStrip());
  renderCatalog(); syncInputs(); paintNow();
  closeDrawer();
  toast(`${U_('from_sheet')} · ${next.length} SKUs`);
}
function matchCat(s){
  if(!s) return null;
  const n = String(s).toLowerCase().trim();
  for(let i=0;i<CATS.length;i++){
    const alts = [CATS[i], D.catl.pt[i], D.catl.en[i], D.catl.es[i]].map(x=>String(x).toLowerCase());
    if(alts.some(a => a === n || n.includes(a) || a.includes(n))) return CATS[i];
  }
  return null;
}
function revertCatalog(){
  bak();
  const keep = {};
  Object.keys(S).forEach(id => { if(!/^(srp|cst|qty)_\d+$/.test(id)) keep[id] = S[id]; });
  const oldIdx = {}; CATALOG.forEach((c,i) => oldIdx[normSku(c.sku)] = i);
  CATALOG = D.catalog.slice();
  CATMETA = { src:'embedded', at:null, rows:CATALOG.length };
  ls.del(K.cat);
  S = keep;
  CATALOG.forEach((c,i) => { const oi = oldIdx[normSku(c.sku)];
    S['srp_'+i] = String(c.srp); S['cst_'+i] = String(c.cost);
    S['qty_'+i] = String(oi !== undefined ? c.qty : c.qty); });
  seth('hmeta', metaStrip());
  renderCatalog(); syncInputs(); paintNow();
  toast(U_('embedded'));
}

function parseImport(){
  const txt = $('imcsv').value;
  const rows = splitCSV(txt);
  if(rows.length < 2){ seth('immap', `<div class="warn on err"><span class="wi">!</span><span>${esc(U_('paste'))}</span></div>`); return; }
  const head = rows[0];
  IMP = { head, rows: rows.slice(1), map: guessMap(head), diff: null };
  seth('immap', `<div class="ttl">${esc(U_('mapcols'))}</div>` + FIELDS.map(f => `
    <div class="fieldrow"><label>${esc(U_('col_'+f))}</label>
      <select data-map="${f}"><option value="">—</option>
        ${head.map((h,i)=>`<option value="${i}"${IMP.map[f]===i?' selected':''}>${esc(String(h).slice(0,42)||'col '+(i+1))}</option>`).join('')}
      </select></div>`).join(''));
  $$('#immap select').forEach(sel => sel.onchange = () => {
    const f = sel.dataset.map;
    if(sel.value === '') delete IMP.map[f]; else IMP.map[f] = parseInt(sel.value);
    showDiff();
  });
  showDiff();
}
function showDiff(){
  if(!IMP) return;
  if(IMP.map.sku === undefined){
    seth('imdiff', `<div class="warn on err"><span class="wi">!</span><span>${esc(U_('col_sku'))} →  —</span></div>`);
    $('imapply').disabled = true; return;
  }
  const d = buildDiff();
  const row = (cls,label,txt) => `<tr><td class="${cls}">${esc(label)}</td><td class="num">${esc(txt)}</td></tr>`;
  let h = `<div class="ttl">${esc(U_('diff'))}</div>
    <table class="diff" style="width:auto;margin-bottom:10px"><tbody>
    ${row('chg',U_('changed'),String(d.changed.length))}
    ${row('add',U_('added'),String(d.added.length))}
    ${row('del',U_('missing'),String(d.missing.length))}
    ${row('sk',U_('unchanged'),String(d.same))}
    </tbody></table>`;
  const list = d.changed.slice(0,60);
  if(list.length){
    h += `<div class="scroll"><table class="diff"><thead><tr><th>SKU</th><th class="num">campo</th>
      <th class="num">de</th><th class="num">para</th></tr></thead><tbody>`;
    list.forEach(r => r.d.forEach(([f,a,b]) =>
      h += `<tr><td class="lbl">${esc(r.sku)}<span class="code">${esc(r.name||'')}</span></td>
        <td class="num sk">${esc(f)}</td><td class="num">${esc(N(a))}</td><td class="num chg">${esc(N(b))}</td></tr>`));
    h += `</tbody></table></div>`;
    if(d.changed.length > 60) h += `<div class="sk" style="margin-top:6px">+ ${d.changed.length-60}</div>`;
  }
  if(d.added.length){
    h += `<div class="ttl" style="margin-top:12px">${esc(U_('added'))}</div><div class="sk">`
      + d.added.slice(0,40).map(r => esc(r.sku)).join(' · ')
      + (d.added.length>40 ? ` + ${d.added.length-40}` : '') + `</div>`;
  }
  if(d.missing.length){
    h += `<div class="ttl" style="margin-top:12px">${esc(U_('missing'))}</div>
      <div class="warn on"><span class="wi">i</span><span>${esc(U_('kept_note'))}</span></div>
      <div class="sk">` + d.missing.slice(0,40).map(x => esc(x.c.sku)).join(' · ')
      + (d.missing.length>40 ? ` + ${d.missing.length-40}` : '') + `</div>`;
  }
  seth('imdiff', h);
  $('imapply').disabled = !(d.changed.length || d.added.length);
  set('imstat', `${d.rows.length} ${LANG==='en'?'rows':LANG==='es'?'filas':'linhas'}${d.bad?` · ${d.bad} ignoradas`:''}`);
}
