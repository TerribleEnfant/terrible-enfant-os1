let PAL = [], PALSEL = 0;
function palItems(){
  const out = [];
  SECS.forEach(k => out.push({ t:T().secs[k], k:U_('jump'), go:() => jump('sec_'+k) }));
  Object.keys(scnAll()).sort().forEach(n => out.push({ t:n, k:U_('scenario'), go:() => scnApply(n) }));
  out.push({ t:U_('copy'), k:U_('act'), go:doCopy });
  out.push({ t:U_('download'), k:U_('act'), go:download });
  out.push({ t:U_('import'), k:U_('act'), go:importDrawer });
  out.push({ t:U_('saved_scn'), k:U_('act'), go:scenarioDrawer });
  out.push({ t:U_('print'), k:U_('act'), go:() => window.print() });
  out.push({ t:U_('expand'), k:U_('act'), go:() => allSec(1) });
  out.push({ t:U_('collapse'), k:U_('act'), go:() => allSec(0) });
  out.push({ t:U_('theme'), k:U_('act'), go:cycleTheme });
  out.push({ t:U_('read') + ' / ' + U_('edit'), k:U_('act'), go:toggleMode });
  return out;
}
function openPalette(){
  PAL = palItems(); PALSEL = 0;
  $('pinput').placeholder = U_('cmd');
  $('pinput').value = '';
  renderPalette('');
  $('palette').classList.add('open');
  setTimeout(() => $('pinput').focus(), 20);
}
function closePalette(){ $('palette').classList.remove('open'); }
function renderPalette(q){
  const ql = q.toLowerCase();
  const hits = PAL.map((it,i) => ({ it, i })).filter(x => x.it.t.toLowerCase().includes(ql)).slice(0,40);
  PALSEL = Math.min(PALSEL, Math.max(0, hits.length-1));
  $('plist').innerHTML = hits.map((x,n) =>
    `<div class="pitem${n===PALSEL?' sel':''}" data-pi="${x.i}">${esc(x.it.t)}<span class="pk">${esc(x.it.k)}</span></div>`).join('');
  $('plist').dataset.hits = JSON.stringify(hits.map(x => x.i));
}
function runPalette(){
  const hits = JSON.parse($('plist').dataset.hits || '[]');
  const idx = hits[PALSEL];
  closePalette();
  if(idx !== undefined && PAL[idx]) PAL[idx].go();
}
function jump(id){ const e = $(id); if(e) e.scrollIntoView({ block:'start' }); }

   ============================================================ */
function togSec(k){
  const b = $('sb_'+k); if(!b) return;
  const h = b.previousElementSibling;
  b.classList.toggle('off'); h.classList.toggle('off');
  saveSecState();
  if(k === 's10' && !b.classList.contains('off')) paintHeavy();
}
function allSec(open){
  SECS.forEach(k => { const b = $('sb_'+k); if(!b) return;
    b.classList.toggle('off', !open); b.previousElementSibling.classList.toggle('off', !open); });
  saveSecState();
  if(open) paintHeavy();
}
function saveSecState(){
  ls.set(K.sec, JSON.stringify(SECS.filter(k => { const b=$('sb_'+k); return b && b.classList.contains('off'); })));
}
function loadSecState(){
  const off = ls.json(K.sec, null);
  if(!Array.isArray(off)) return;
  off.forEach(k => { const b=$('sb_'+k); if(b){ b.classList.add('off'); b.previousElementSibling.classList.add('off'); } });
}
function applyTheme(t){
  const eff = t === 'auto'
    ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
  document.documentElement.dataset.theme = eff;
  ls.set(K.theme, t);
  $('themetog').title = U_('theme') + ' · ' + t;
}
function cycleTheme(){
  const cur = ls.get(K.theme) || 'auto';
  applyTheme(cur === 'auto' ? 'light' : cur === 'light' ? 'dark' : 'auto');
}
function setLang(l){
  if(!D.i18n[l]) return;
  LANG = l; ls.set(K.lang, l);
  $$('#langseg button').forEach(b => b.classList.toggle('on', b.dataset.lang === l));
  buildAll(); paintNow();
}
function setCur(c){
  CUR = c; ls.set(K.cur, c);
  $$('#curseg button').forEach(b => b.classList.toggle('on', b.dataset.cur === c));
  syncInputs(); paintNow();
}
function toggleMode(){
  MODE = MODE === 'edit' ? 'read' : 'edit';
  ls.set(K.mode, MODE);
  document.body.classList.toggle('read', MODE === 'read');
  $('modetog').title = MODE === 'read' ? U_('read') : U_('edit');
  toast(MODE === 'read' ? U_('read') : U_('edit'));
}

/* ---------- botões de duplo clique (destrutivos) ---------- */
function arm(btn, label, fn){
  if(btn.dataset.armed){ delete btn.dataset.armed; btn.textContent = label; btn.classList.remove('dgr'); fn(); return; }
  btn.dataset.armed = '1'; btn.textContent = U_('confirm'); btn.classList.add('dgr');
  setTimeout(() => { if(btn.dataset.armed){ delete btn.dataset.armed; btn.textContent = label; btn.classList.remove('dgr'); } }, 4000);
}

    const g = D.regimes.find(x => x.k === b.dataset.reg); if(!g) return;
    Object.keys(g.v).forEach(k => S[k] = String(g.v[k]));
    syncInputs(); paintNow();
  });
  const fb = $('fillbtn'); if(fb) fb.onclick = () => fillQty(null);
  $$('[data-fillcat]').forEach(b => b.onclick = () => fillQty(b.dataset.fillcat));
  // catálogo: busca / filtro / ordem
  const cq = $('catq'); if(cq) cq.oninput = () => { CATVIEW.q = cq.value; renderCatalog(); paintNow(); };
  const cf = $('catfilter'); if(cf) cf.onchange = () => { CATVIEW.cat = cf.value; renderCatalog(); paintNow(); };
  const cs = $('catsort'); if(cs) cs.onchange = () => { CATVIEW.sort = cs.value; renderCatalog(); paintNow(); };
  // comparação
  $$('[data-cmp]').forEach(c => c.onchange = () => {
    if(c.checked) CMP.add(c.dataset.cmp); else CMP.delete(c.dataset.cmp);
    renderCompare();
  });
  // rail
  $$('[data-act]').forEach(a => a.onclick = e => {
    e.preventDefault();
    ({ a2_copy:doCopy, a2_import:importDrawer, a2_print:() => window.print() })[a.dataset.act]();
    $('rail').classList.remove('open');
  });
  $$('[data-rail]').forEach(a => a.onclick = () => $('rail').classList.remove('open'));
  $$('[data-lang2]').forEach(b => b.onclick = () => setLang(b.dataset.lang2));
  $$('[data-cur2]').forEach(b => b.onclick = () => { setCur(b.dataset.cur2);
    $$('[data-cur2]').forEach(x => x.classList.toggle('on', x.dataset.cur2 === CUR)); });
  $$('[data-pref]').forEach(b => b.onclick = () => (b.dataset.pref === 'theme' ? cycleTheme() : toggleMode()));
}
function fillQty(cat){
  const v = String(num(S.fillv));
  CATALOG.forEach((c,i) => { if(!cat || c.cat === cat) S['qty_'+i] = v; });
  syncInputs(); paintNow();
}

function wireStatic(){
  $('railtog').onclick = () => $('rail').classList.toggle('open');
  $('scnchip').onclick = scenarioDrawer;
  $('themetog').onclick = cycleTheme;
  $('modetog').onclick = toggleMode;
  $('cmdtog').onclick = openPalette;
  $$('#curseg button').forEach(b => b.onclick = () => setCur(b.dataset.cur));
  $$('#langseg button').forEach(b => b.onclick = () => setLang(b.dataset.lang));
  $$('[data-close]').forEach(e => e.onclick = () => { closeDrawer(); closePalette(); });
  $('pinput').oninput = () => { PALSEL = 0; renderPalette($('pinput').value); };
  $('pinput').onkeydown = e => {
    if(e.key === 'ArrowDown'){ e.preventDefault(); PALSEL++; renderPalette($('pinput').value); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); PALSEL = Math.max(0, PALSEL-1); renderPalette($('pinput').value); }
    else if(e.key === 'Enter'){ e.preventDefault(); runPalette(); }
    else if(e.key === 'Escape'){ closePalette(); }
  };
  $('plist').onclick = e => {
    const it = e.target.closest('[data-pi]'); if(!it) return;
    const hits = JSON.parse($('plist').dataset.hits || '[]');
    PALSEL = hits.indexOf(parseInt(it.dataset.pi));
    runPalette();
  };
  // atalhos globais
  addEventListener('keydown', e => {
    const inField = /INPUT|TEXTAREA|SELECT/.test((e.target.tagName||''));
    if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openPalette(); return; }
    if(e.key === 'Escape'){ closeDrawer(); closePalette(); $('rail').classList.remove('open'); return; }
    if(!inField && e.key === '/'){ e.preventDefault();
      const q = $('catq'); if(q){ jump('sec_s2'); setTimeout(() => q.focus(), 260); } return; }
    // navegação por setas na grade
    if(inField && e.target.dataset && e.target.dataset.grid && /^Arrow/.test(e.key)){
      const cell = e.target.closest('td'), row = e.target.closest('tr');
      if(!cell || !row) return;
      const ci = Array.from(row.children).indexOf(cell);
      let tgt = null;
      if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){
        let r = row;
        do { r = e.key === 'ArrowUp' ? r.previousElementSibling : r.nextElementSibling; }
        while(r && !(r.children[ci] && r.children[ci].querySelector('input[data-grid]')));
        tgt = r && r.children[ci].querySelector('input[data-grid]');
      } else {
        let c = cell;
        do { c = e.key === 'ArrowLeft' ? c.previousElementSibling : c.nextElementSibling; }
        while(c && !c.querySelector('input[data-grid]'));
        tgt = c && c.querySelector('input[data-grid]');
      }
      if(tgt){ e.preventDefault(); tgt.focus(); tgt.select(); }
    }
  });
  // barra fixa + scroll spy
  const tb = $('topbar');
  addEventListener('scroll', () => {
    tb.classList.toggle('stuck', scrollY > 4);
    let cur = SECS[0];
    SECS.forEach(k => { const s = $('sec_'+k);
      if(s && s.getBoundingClientRect().top < 140) cur = k; });
    $$('[data-rail]').forEach(a => a.classList.toggle('on', a.dataset.rail === cur));
  }, { passive:true });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if((ls.get(K.theme) || 'auto') === 'auto') applyTheme('auto');
  });
}


/* ============================================================
   BOOT
   ============================================================ */
(async function init(){
  const qs = new URLSearchParams(location.search);

  /* --- preferências --- */
  LANG = qs.get('lang') || ls.get(K.lang) || 'pt';
  if(!D.i18n[LANG]) LANG = 'pt';
  CUR  = qs.get('cur') || ls.get(K.cur) || ls.get(OLD.cur) || 'brl';
  if(CUR !== 'usd') CUR = 'brl';
  MODE = qs.get('mode') || ls.get(K.mode) || 'edit';
  applyTheme(ls.get(K.theme) || 'auto');
  document.body.classList.toggle('read', MODE === 'read');

  /* --- catálogo persistido (importação anterior) --- */
  const cs = ls.json(K.cat, null);
  if(cs && Array.isArray(cs.c) && cs.c.length){ CATALOG = cs.c; CATMETA = cs.m || CATMETA; }

  /* --- estado: hash > localStorage > semente --- */
  let st = null, baseName = null;
  const fromHash = await readHash();
  if(fromHash && fromHash.s){
    st = fromHash.s; baseName = fromHash.base || null;
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
  }
  if(!st) st = loadState();
  if(!st){
    const seed = D.scenarios[D.seed_active];
    st = coerceState({ vals:seed, skus:D.meta.seed_skus || LEGACY_SKUS });
    baseName = D.seed_active;
  }
  S = st || blankState();

  const savedBase = ls.json(K.base, null);
  if(baseName){
    const all = scnAll();
    BASE = { name:baseName, vals: all[baseName]
      ? coerceState({ vals:all[baseName].v, skus:all[baseName].skus })
      : Object.assign({}, S) };
  } else if(savedBase && savedBase.name){
    BASE = savedBase;
  } else {
    BASE = { name:D.seed_active, vals:coerceState({ vals:D.scenarios[D.seed_active], skus:D.meta.seed_skus || LEGACY_SKUS }) };
  }
  scnAll();   // garante a migração dos cenários da versão anterior

  /* --- monta e pinta --- */
  $$('#curseg button').forEach(b => b.classList.toggle('on', b.dataset.cur === CUR));
  $$('#langseg button').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
  buildAll();
  wireStatic();
  const b = $('a_undo'); if(b) b.hidden = !ls.get(K.bak);
  set('fxinfo', U_('fx_man'));
  paintNow();
})();

</script>
